<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Between · Design studio (offline)</title>
<link rel="stylesheet" href="kit.css">
<style>
:root{
 --bg:#EDE9E1;--panel:#F7F4EE;--panel-2:#FFFDF9;--line-b:#DAD4C8;--txt:#1F2733;--sub:#5D6573;--faint:#8A909B;
 --accent:#1F2733;--ok:#2E7D5B;--warn:#A86A12;--bad:#B3261E;
 --ease-out:cubic-bezier(.23,1,.32,1);--rail:264px;--bar:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:600 11px/1 "DM Sans";padding:3px 6px;border-radius:6px;background:#fff;border:1px solid var(--line-b);box-shadow:0 1px 0 var(--line-b);color:var(--sub)}
:focus-visible{outline:2px solid #244B82;outline-offset:2px;border-radius:8px}

/* press feedback (Emil): fast ease-out scale on every pressable */
.press{transition:transform 160ms var(--ease-out),background-color 150ms ease,color 150ms ease,box-shadow 150ms ease}
.press:active{transform:scale(.97)}
.phone .btn,.phone .ibtn,.phone .chip{transition:transform 160ms var(--ease-out)}
.phone .btn:active,.phone .ibtn:active,.phone .chip:active{transform:scale(.97)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line-b);z-index:20}
.logo{font-family:Fraunces;font-weight:600;font-size:20px;letter-spacing:-.3px;white-space:nowrap}
.logo span{font-family:"DM Sans";font-weight:500;font-size:12px;color:var(--sub);margin-left:6px}
.modes{display:flex;background:#E6E1D7;border-radius:999px;padding:3px}
.modes button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub)}
.modes button[aria-pressed=true]{background:#fff;color:var(--txt);box-shadow:0 1px 3px #0001}
.spacer{flex:1}
.swatches{display:flex;gap:4px}
.swatch{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;border:2px solid transparent}
.swatch i{width:20px;height:20px;border-radius:99px;position:relative;overflow:hidden;display:block}
.swatch i:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--h)}
.swatch[aria-pressed=true]{border-color:var(--txt)}
.pill{height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line-b);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.dark{background:var(--txt);color:#fff;border-color:var(--txt)}

/* ---------- rail ---------- */
.rail{position:fixed;top:var(--bar);bottom:0;left:0;width:var(--rail);background:var(--panel);border-right:1px solid var(--line-b);display:flex;flex-direction:column;z-index:10}
.progress{padding:18px 18px 12px;border-bottom:1px solid var(--line-b)}
.progress b{font-size:13px}
.track{height:6px;border-radius:9px;background:#E3DED4;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width 300ms var(--ease-out)}
.list{flex:1;overflow-y:auto;padding:8px}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-align:left}
.item:hover{background:#EFEAE1}
.item[aria-current=true]{background:#fff;box-shadow:0 1px 3px #0000000f}
.item .n{font-family:Fraunces;font-weight:600;font-size:14px;color:var(--faint);width:20px}
.item .t{flex:1;font-size:14px;font-weight:600}
.item .s{font-size:11px;color:var(--sub);font-weight:500}
.badge{min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#E6E1D7;color:var(--faint)}
.badge.on{background:var(--ok);color:#fff}
.keys{padding:14px 18px;border-top:1px solid var(--line-b);font-size:12px;color:var(--sub);line-height:24px}

/* ---------- stage ---------- */
.stage{position:fixed;top:var(--bar);left:var(--rail);right:0;bottom:0;overflow-y:auto;scroll-behavior:smooth}
.page{padding:26px 32px 80px;max-width:2000px}
.pagehead{display:flex;align-items:flex-end;gap:20px;margin-bottom:20px}
.pagehead .num{font-family:Fraunces;font-weight:600;font-size:14px;color:var(--faint)}
.pagehead h1{font-family:Fraunces;font-weight:600;font-size:32px;letter-spacing:-.7px;line-height:36px}
.pagehead p{color:var(--sub);font-size:15px;margin-top:2px}
.pagehead .nav{margin-left:auto;display:flex;gap:8px}
.options{display:flex;gap:28px;align-items:flex-start;flex-wrap:nowrap;overflow-x:auto;padding:6px 4px 12px;scroll-snap-type:x proximity}
.opt{flex:none;display:flex;flex-direction:column;gap:12px;scroll-snap-align:start;border-radius:28px;padding:10px;transition:background-color 200ms ease,box-shadow 200ms ease}
.opt.chosen{background:#fff;box-shadow:0 0 0 2px var(--ok),0 10px 30px -18px #0005}
.frame{position:relative}
.frame .phone{box-shadow:0 24px 50px -30px rgba(31,39,51,.5)}
.chosen-tag{position:absolute;top:-8px;right:-8px;z-index:5;background:var(--ok);color:#fff;font-size:12px;font-weight:700;height:28px;padding:0 12px;border-radius:99px;display:flex;align-items:center;gap:6px;box-shadow:0 0 0 3px var(--bg)}
.meta{padding:0 4px;display:flex;flex-direction:column;gap:8px}
.meta-h{display:flex;align-items:center;gap:8px}
.letter{width:26px;height:26px;border-radius:8px;background:var(--txt);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.meta-h h3{font-size:16px;font-weight:700;flex:1}
.round{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#E6E1D7;color:var(--sub)}
.round.r2{background:#DCEBE2;color:#1F5C41}
.meta ul{padding-left:16px;font-size:13px;line-height:19px;color:var(--sub)}
.choose{height:40px;border-radius:12px;font-size:14px;font-weight:700;background:var(--txt);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.opt.chosen .choose{background:var(--ok)}
.checks{border-top:1px solid var(--line-b);padding-top:8px;font-size:12px;line-height:18px}
.checks summary{cursor:pointer;font-weight:700;color:var(--sub);list-style:none;display:flex;align-items:center;gap:6px}
.checks summary::-webkit-details-marker{display:none}
.chk{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:var(--sub)}
.chk i{font-style:normal;font-weight:700;width:14px;flex:none}
.chk.ok i{color:var(--ok)}.chk.warn i{color:var(--warn)}.chk.bad i{color:var(--bad)}
.chk small{display:block;color:var(--faint);font-size:11px}
.dotrow{display:inline-flex;gap:3px}.dotrow b{width:8px;height:8px;border-radius:9px;display:block}

.section-h{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px;border-top:1px solid var(--line-b);padding-top:16px}
.section-h h2{font-size:15px;font-weight:700}
.section-h span{font-size:13px;color:var(--sub)}
.flow{display:flex;gap:20px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x mandatory}
.flow figure{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.flow figcaption{font-size:12px;font-weight:600;color:var(--sub);padding-left:6px}
.notes{width:100%;max-width:760px;min-height:84px;border-radius:14px;border:1px solid var(--line-b);background:var(--panel-2);padding:12px 14px;font:15px/22px "DM Sans";color:var(--txt);resize:vertical}

/* overview */
.ov-row{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line-b);align-items:start}
.ov-row h3{font-family:Fraunces;font-weight:600;font-size:20px}
.ov-row p{font-size:13px;color:var(--sub);margin-top:4px}
.ov-opts{display:flex;gap:14px;flex-wrap:wrap}
.ov-opt{cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-radius:20px;padding:6px;text-align:left}
.ov-opt:hover{background:#fff}
.ov-opt.chosen{background:#fff;box-shadow:0 0 0 2px var(--ok)}
.ov-opt > span{font-size:12px;font-weight:700;padding-left:4px}
.ov-opt .phone{pointer-events:none}

/* picks */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.pick{background:var(--panel-2);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pick h3{font-size:15px}.pick p{font-size:13px;color:var(--sub);white-space:pre-wrap}
.pick .empty{height:200px;border:1.5px dashed var(--line-b);border-radius:16px;display:grid;place-items:center;color:var(--faint);font-size:13px}
.theme-report{background:var(--panel-2);border-radius:20px;padding:18px;margin-bottom:24px;font-size:13px}
.theme-report table{border-collapse:collapse;width:100%;margin-top:8px}
.theme-report td,.theme-report th{padding:6px 8px;border-bottom:1px solid var(--line-b);text-align:left}
.sample{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--txt);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;transition:transform 400ms ease,opacity 400ms ease;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

/* choreography: phone frames are static; their content arrives once, as one wave.
   Lead (first block) rises most; support rises less; delays shrink (0,50,90,120,140). */
@keyframes rise{from{opacity:0;transform:translateY(var(--dy,8px))}}
.enter .phone .scroll > .v > *{animation:rise 300ms var(--ease-out) both}
.enter .phone .scroll > .v > *:nth-child(1){--dy:12px;animation-delay:0ms}
.enter .phone .scroll > .v > *:nth-child(2){--dy:10px;animation-delay:50ms}
.enter .phone .scroll > .v > *:nth-child(3){--dy:8px;animation-delay:90ms}
.enter .phone .scroll > .v > *:nth-child(4){--dy:6px;animation-delay:120ms}
.enter .phone .scroll > .v > *:nth-child(n+5){--dy:4px;animation-delay:140ms}
.enter .opt:nth-child(2) .phone .scroll > .v > *{animation-delay:calc(var(--d2,0ms) + 30ms)}
@media (prefers-reduced-motion:reduce){
 .enter .phone .scroll > .v > *{animation:fadeonly 200ms ease both!important;animation-delay:0ms!important}
 .press:active,.phone .btn:active{transform:none}
 .toast{transition:opacity 200ms ease}
}
@keyframes fadeonly{from{opacity:0}}
#measure{position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<header class="topbar">
 <div class="logo">Between<span>Design studio · offline</span></div>
 <div class="modes" role="group" aria-label="View">
  <button class="press" data-mode="decide">Decide <kbd>D</kbd></button>
  <button class="press" data-mode="overview">Overview <kbd>O</kbd></button>
  <button class="press" data-mode="picks">My picks <kbd>P</kbd></button>
 </div>
 <div class="spacer"></div>
 <div class="swatches" id="swatches" role="group" aria-label="Palette"></div>
 <button class="pill press" id="modeBtn" aria-label="Toggle dark mode">Light</button>
 <button class="pill dark press" id="exportBtn">Export picks</button>
</header>

<aside class="rail" aria-label="Pages">
 <div class="progress"><b id="progTxt">0 of 10 decided</b><div class="track"><i id="progBar" style="width:0"></i></div></div>
 <nav class="list" id="list"></nav>
 <div class="keys"><kbd>←</kbd> <kbd>→</kbd> pages &nbsp; <kbd>1</kbd>–<kbd>4</kbd> choose<br><kbd>D</kbd> <kbd>O</kbd> <kbd>P</kbd> views &nbsp; <kbd>T</kbd> theme</div>
</aside>

<main class="stage" id="stage"></main>
<div id="measure" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="kit.js"></script>
<script src="v2.js"></script>
<script>
/* ============================================================
   STATE (persists in this browser only — nothing leaves the file)
   ============================================================ */
const KEY="between-studio-v1";
const S=Object.assign({picks:{},notes:{},page:0,mode:"decide",theme:"postcard",dark:false},JSON.parse(localStorage.getItem(KEY)||"{}"));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
cur.id=S.theme; cur.mode=S.dark?"dark":"light";
const LETTERS="ABCD";
const $=s=>document.querySelector(s);
const stage=$("#stage");

/* ============================================================
   CHECKS — run on an unscaled offscreen copy of each option
   ============================================================ */
function rgb(c){const m=c.match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);return{r:p[0],g:p[1],b:p[2],a:p[3]===undefined?1:p[3]}}
function hexRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16),a:1}}
function L({r,g,b}){return[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
const ratio=(a,b)=>{const x=L(a),y=L(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function bgOf(el){while(el&&el.nodeType===1){const c=rgb(getComputedStyle(el).backgroundColor);if(c&&c.a>=.95)return c;if(c&&c.a>0.05)return null;el=el.parentElement}return null}
const cache=new Map();
function checks(html){
 const k=cur.id+cur.mode+html.length+html.slice(200,260);
 if(cache.has(k))return cache.get(k);
 const m=$("#measure");m.innerHTML=html;const root=m.querySelector(".screen");
 const sheet=root.querySelector(".sheet");
 const scope=sheet||root;
 const res=[];
 // 1. one primary action
 const pri=[...scope.querySelectorAll(".btn.pri")].length;
 res.push(pri<=1?{s:"ok",t:`One primary action${pri?"":" (none: a browsing screen)"}`}:{s:"bad",t:`${pri} primary buttons`,d:"DESIGN.md allows one per screen"});
 // 2. contrast of every text element against its painted background
 let fails=[],tested=0;
 root.querySelectorAll("*").forEach(el=>{
  if(el.closest("svg"))return;
  const own=[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
  if(!own)return;
  const cs=getComputedStyle(el);if(cs.visibility==="hidden"||+cs.opacity<.5)return;
  const fg=rgb(cs.color),bg=bgOf(el);if(!fg||!bg||fg.a<.95)return;
  tested++;
  const size=parseFloat(cs.fontSize),bold=+cs.fontWeight>=700,large=size>=24||(size>=18.66&&bold);
  const r=ratio(fg,bg),need=large?3:4.5;
  if(r<need)fails.push({txt:el.textContent.trim().slice(0,28),r:r.toFixed(2)});
 });
 const uniq=[...new Map(fails.map(f=>[f.txt,f])).values()];
 res.push(uniq.length?{s:"bad",t:`${uniq.length} text contrast issue${uniq.length>1?"s":""} (of ${tested})`,d:uniq.slice(0,3).map(f=>`“${f.txt}” ${f.r}:1`).join(" · ")}:{s:"ok",t:`Text contrast passes AA (${tested} checked)`});
 // 3. touch targets
 const small=[...scope.querySelectorAll(".btn,.ibtn,.chip,.toggle")].filter(e=>e.offsetHeight<44||e.offsetWidth<44);
 res.push(small.length?{s:"warn",t:`${small.length} target${small.length>1?"s":""} under 44pt`,d:"Chips and toggles need hitSlop to reach 44×44"}:{s:"ok",t:"All targets ≥ 44pt"});
 // 4. smallest type
 let minF=99;root.querySelectorAll("*").forEach(el=>{if(el.closest("svg"))return;if([...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))minF=Math.min(minF,parseFloat(getComputedStyle(el).fontSize))});
 res.push(minF<11?{s:"warn",t:`Smallest text ${minF}px`,d:"Only tab labels may go below 11px"}:{s:"ok",t:`Smallest text ${minF}px`});
 // 5. length
 const sc=root.querySelector(".scroll");const screens=sc?sc.scrollHeight/sc.clientHeight:1;
 res.push({s:screens>2.6?"warn":"ok",t:screens<=1.05?"Fits on one screen":`${screens.toFixed(1)} screens tall`,d:screens>2.6?"Long: check that the stopping point arrives soon enough":""});
 m.innerHTML="";cache.set(k,res);return res;
}
const score=r=>r.reduce((s,c)=>s+(c.s==="ok"?0:c.s==="warn"?1:3),0);
const chkHtml=r=>`<details class="checks"><summary><span class="dotrow">${r.map(c=>`<b style="background:var(--${c.s==="ok"?"ok":c.s==="warn"?"warn":"bad"})"></b>`).join("")}</span> Checks · ${r.filter(c=>c.s==="ok").length}/${r.length} pass</summary>${r.map(c=>`<div class="chk ${c.s}"><i>${c.s==="ok"?"✓":c.s==="warn"?"!":"✕"}</i><span>${c.t}${c.d?`<small>${c.d}</small>`:""}</span></div>`).join("")}</details>`;

/* ============================================================
   LAYOUT
   ============================================================ */
function fitZoom(n){
 const w=stage.clientWidth-64-8, gap=28+20; // option padding + gap
 const byW=(w-gap*(n-1))/(n*380);
 const byH=(innerHeight-60-26-80-190)/760;
 return Math.max(.5,Math.min(1,byW,Math.max(byH,.62)));
}
const zoomed=(html,z)=>`<div style="zoom:${z}">${html}</div>`;

function renderRail(){
 const done=PAGES.filter(p=>S.picks[p.id]).length;
 $("#progTxt").textContent=`${done} of ${PAGES.length} decided`;
 $("#progBar").style.width=(done/PAGES.length*100)+"%";
 $("#list").innerHTML=PAGES.map((p,i)=>{const pk=S.picks[p.id];const o=pk&&p.options.find(x=>x.id===pk);
  return `<button class="item press" data-i="${i}" ${S.mode==="decide"&&i===S.page?'aria-current="true"':""}><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${p.title}<div class="s">${o?o.label:p.options.length+" options"}</div></span><span class="badge ${pk?"on":""}">${pk||"–"}</span></button>`}).join("");
 $("#list").querySelectorAll(".item").forEach(b=>b.onclick=()=>go(+b.dataset.i,true));
 document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
}

function renderDecide(animate){
 const p=PAGES[S.page], z=fitZoom(p.options.length);
 const best=Math.min(...p.options.map(o=>score(checks(o.html))));
 stage.innerHTML=`<div class="page ${animate?"enter":""}">
  <div class="pagehead"><div><div class="num">${String(S.page+1).padStart(2,"0")} / ${PAGES.length}</div><h1>${p.title}</h1><p>${p.q}</p></div>
   <div class="nav"><button class="pill press" id="prev" ${S.page===0?"disabled style='opacity:.4'":""}>← Previous</button><button class="pill dark press" id="next">${S.page===PAGES.length-1?"See my picks":"Next page"} →</button></div></div>
  <div class="options">${p.options.map((o,i)=>{const r=checks(o.html),ch=S.picks[p.id]===o.id;
   return `<div class="opt ${ch?"chosen":""}" data-id="${o.id}">
    <div class="frame">${ch?`<div class="chosen-tag">✓ Chosen</div>`:""}${zoomed(o.html,z)}</div>
    <div class="meta" style="width:${360*z}px">
     <div class="meta-h"><span class="letter">${o.id}</span><h3>${o.label}</h3><span class="round ${o.round===2?"r2":""}">${o.round===2?"New · round 2":"Round 1"}</span></div>
     <ul>${o.notes.map(n=>`<li>${n}</li>`).join("")}</ul>
     ${chkHtml(r)}${score(r)===best&&p.options.length>1?`<div class="chk ok" style="font-size:12px"><i>★</i><span>Cleanest checks on this page</span></div>`:""}
     <button class="choose press" data-choose="${o.id}">${ch?"✓ Chosen":`Choose ${o.id}`} <kbd style="background:transparent;color:inherit;border-color:#fff5;box-shadow:none">${i+1}</kbd></button>
    </div></div>`}).join("")}</div>
  ${p.flow.length?`<div class="section-h"><h2>Also in this flow</h2><span>${p.flow.length} supporting screen${p.flow.length>1?"s":""}. These ship with whichever option you pick. Scroll sideways.</span></div>
   <div class="flow">${p.flow.map(f=>`<figure>${zoomed(f.html,.62)}<figcaption>${f.label}</figcaption></figure>`).join("")}</div>`:""}
  <div class="section-h"><h2>Your notes</h2><span>Saved as you type, kept in this browser only.</span></div>
  <textarea class="notes" id="notes" placeholder="What to keep, what to change…">${S.notes[p.id]||""}</textarea>
 </div>`;
 stage.querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>choose(b.dataset.choose));
 $("#prev").onclick=()=>go(S.page-1,true);
 $("#next").onclick=()=>S.page===PAGES.length-1?setMode("picks"):go(S.page+1,true);
 $("#notes").oninput=e=>{S.notes[p.id]=e.target.value;save()};
}

function renderOverview(){
 stage.innerHTML=`<div class="page"><div class="pagehead"><div><h1>Every decision at a glance</h1><p>Click an option to choose it, or a page title to open it.</p></div></div>
  ${PAGES.map((p,i)=>`<div class="ov-row"><div><button class="press" data-open="${i}" style="text-align:left"><h3>${p.title}</h3></button><p>${p.q}</p></div>
   <div class="ov-opts">${p.options.map(o=>`<div role="button" tabindex="0" aria-pressed="${S.picks[p.id]===o.id}" aria-label="Choose ${o.id}, ${o.label} for ${p.title}" class="ov-opt press ${S.picks[p.id]===o.id?"chosen":""}" data-p="${p.id}" data-o="${o.id}">${zoomed(o.html,.36)}<span>${o.id} · ${o.label}${S.picks[p.id]===o.id?" ✓":""}</span></div>`).join("")}</div></div>`).join("")}</div>`;
 stage.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.open;setMode("decide",true)});
 stage.querySelectorAll(".ov-opt").forEach(b=>b.onclick=()=>{S.picks[b.dataset.p]=b.dataset.o;save();renderRail();renderOverview()});
}

function themeReport(){
 const t=T[cur.id][cur.mode], fam=cur.mode==="dark"?FAM_DARK:FAM_LIGHT;
 const pairs=[["ink","canvas"],["ink-secondary","canvas"],["ink-tertiary","canvas"],["ink-tertiary","sunken"],["on-action","action"],["on-action-soft","action-soft"],["highlight-ink","highlight"]].map(([f,b])=>[f+" on "+b,t[f],t[b]])
  .concat(Object.keys(fam).filter(k=>k!=="teal").map(k=>[`${k}-deep on ${k}-soft`,fam[k][2],fam[k][1]]));
 return `<div class="theme-report"><b>${T[cur.id].label} · ${cur.mode} — role contrast</b><table><tr><th>Pair</th><th>Sample</th><th>Ratio</th><th></th></tr>${pairs.map(([n,f,b])=>{const r=ratio(hexRgb(f),hexRgb(b));return `<tr><td>${n}</td><td><span class="sample" style="color:${f};background:${b}">Between</span></td><td>${r.toFixed(2)}:1</td><td style="color:var(--${r>=4.5?"ok":"bad"});font-weight:700">${r>=4.5?"AA ✓":"below AA"}</td></tr>`}).join("")}</table></div>`;
}
function renderPicks(){
 const done=PAGES.filter(p=>S.picks[p.id]).length;
 stage.innerHTML=`<div class="page"><div class="pagehead"><div><h1>My picks</h1><p>${done} of ${PAGES.length} pages decided. Export writes a Markdown file you can paste into docs/ or an issue.</p></div>
  <div class="nav"><button class="pill press" id="copyMd">Copy Markdown</button><button class="pill press" id="resetBtn">Clear picks</button><button class="pill dark press" id="dl">Download .md</button></div></div>
  ${themeReport()}
  <div class="picks">${PAGES.map((p,i)=>{const o=p.options.find(x=>x.id===S.picks[p.id]);return `<div class="pick"><h3>${p.title}</h3>${o?`<div role="button" tabindex="0" aria-label="Open ${p.title}" class="press" data-open="${i}" style="align-self:flex-start;cursor:pointer">${zoomed(o.html,.5)}</div><b style="font-size:13px">${o.id} · ${o.label}</b>`:`<button class="empty press" data-open="${i}">Not decided yet · open</button>`}${S.notes[p.id]?`<p>${S.notes[p.id].replace(/</g,"&lt;")}</p>`:""}</div>`}).join("")}</div></div>`;
 stage.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.page=+b.dataset.open;setMode("decide",true)});
 $("#dl").onclick=download;$("#copyMd").onclick=()=>navigator.clipboard.writeText(md()).then(()=>toast("Copied as Markdown"),()=>toast("Copy blocked: use Download"));
 $("#resetBtn").onclick=()=>{S.picks={};save();renderRail();renderPicks();toast("Picks cleared · notes kept")};
}

function md(){
 const d=new Date().toISOString().slice(0,10);
 return `# Between — design decisions (${d})\n\nPreviewed in: ${T[cur.id].label}, ${cur.mode}\nSource: docs/design/redesign/studio.html\n\n`+PAGES.map(p=>{const o=p.options.find(x=>x.id===S.picks[p.id]);return `## ${p.title}\n${p.q}\n\n- **Chosen:** ${o?`${o.id} · ${o.label} (round ${o.round})`:"_not decided_"}\n${o?o.notes.map(n=>`  - ${n}`).join("\n")+"\n":""}${S.notes[p.id]?`\n**Notes:** ${S.notes[p.id]}\n`:""}`}).join("\n");
}
function download(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md()],{type:"text/markdown"}));a.download="between-design-decisions.md";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Downloaded between-design-decisions.md")}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

/* ============================================================
   ACTIONS
   ============================================================ */
function syncHash(){const h=S.mode==="decide"?PAGES[S.page].id:S.mode;if(location.hash.slice(1)!==h)history.replaceState(null,"","#"+h)}
function render(animate=false){syncHash();renderRail();({decide:renderDecide,overview:renderOverview,picks:renderPicks})[S.mode](animate)}
function setMode(m,animate=false){S.mode=m;save();stage.scrollTop=0;render(animate)}
// Pointer navigation gets the one-time entrance wave; keyboard navigation swaps instantly (seen many times).
function go(i,animate){if(i<0||i>=PAGES.length)return;S.page=i;S.mode="decide";save();stage.scrollTop=0;render(animate)}
function choose(id){const p=PAGES[S.page];S.picks[p.id]=S.picks[p.id]===id?undefined:id;if(!S.picks[p.id])delete S.picks[p.id];save();
 const y=stage.scrollTop;render(false);stage.scrollTop=y;toast(S.picks[p.id]?`${p.title}: chose ${id}`:`${p.title}: choice cleared`)}
function setTheme(){S.theme=cur.id;S.dark=cur.mode==="dark";save();applyTheme();
 document.querySelectorAll(".swatch").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===cur.id));
 $("#modeBtn").textContent=cur.mode==="dark"?"Dark":"Light";const y=stage.scrollTop;render(false);stage.scrollTop=y}

$("#swatches").innerHTML=Object.entries(T).map(([id,t])=>`<button class="swatch press" data-id="${id}" title="${t.label}" aria-label="${t.label}" style="--h:${t.light.highlight}"><i style="background:${t.light.action}"></i></button>`).join("");
document.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{cur.id=b.dataset.id;setTheme()});
$("#modeBtn").onclick=()=>{cur.mode=cur.mode==="dark"?"light":"dark";setTheme()};
$("#exportBtn").onclick=download;
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
addEventListener("keydown",e=>{
 if(e.target.closest("textarea,input")||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==="arrowright"||k==="j"){e.preventDefault();S.page===PAGES.length-1&&S.mode==="decide"?setMode("picks"):go(S.mode==="decide"?S.page+1:S.page,false)}
 else if(k==="arrowleft"||k==="k"){e.preventDefault();go(S.mode==="decide"?S.page-1:S.page,false)}
 else if(/^[1-4]$/.test(k)&&S.mode==="decide"){const o=PAGES[S.page].options[+k-1];if(o)choose(o.id)}
 else if(k==="d")setMode("decide");else if(k==="o")setMode("overview");else if(k==="p")setMode("picks");
 else if(k==="t"){const ids=Object.keys(T);cur.id=ids[(ids.indexOf(cur.id)+1)%ids.length];setTheme()}
});
stage.addEventListener("keydown",e=>{const b=e.target.closest('[role="button"]');if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();b.click()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.mode==="decide"){const y=stage.scrollTop;render(false);stage.scrollTop=y}},150)});

{const h=location.hash.slice(1),i=PAGES.findIndex(p=>p.id===h);if(i>=0){S.page=i;S.mode="decide"}else if(h==="overview"||h==="picks")S.mode=h}
addEventListener("hashchange",()=>{const h=location.hash.slice(1),i=PAGES.findIndex(p=>p.id===h);if(i>=0&&(i!==S.page||S.mode!=="decide"))go(i,true);else if((h==="overview"||h==="picks")&&S.mode!==h)setMode(h)});
applyTheme();
document.querySelectorAll(".swatch").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===cur.id));
$("#modeBtn").textContent=cur.mode==="dark"?"Dark":"Light";
render(true);
</script>
</body>
</html>
