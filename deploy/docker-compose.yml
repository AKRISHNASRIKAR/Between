# Production on a single small VM (e.g. Oracle Cloud Always Free).
# Postgres is external (Neon); photos go to Cloudflare R2; Caddy provides HTTPS.
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  caddy_data:
